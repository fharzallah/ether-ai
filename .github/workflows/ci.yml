name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Les memes commandes que celles documentees dans le README
      - name: Lint (syntaxe main, preload, renderer)
        run: npm run lint
      - name: Smoke tests (structure, securite, CSP, contextBridge)
        run: npm test
