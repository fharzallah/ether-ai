name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Les memes commandes que celles documentees dans le README
      - name: Lint (syntaxe renderer + worker)
        run: npm run lint
      - name: Smoke tests (structure, securite, CSP, non-regression)
        run: npm test
