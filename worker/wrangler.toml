name = "ether-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# En production, remplacer "*" par l'origine exacte du site (Cloudflare Pages).
# Exemple : CORS_ORIGIN = "https://ether-ai.pages.dev"
CORS_ORIGIN = "*"

# Les cles API sont des secrets, jamais dans ce fichier.
# Liste complete et guide : DEPLOY.md. Par exemple :
#   npx wrangler secret put JWT_SECRET      <- OBLIGATOIRE : sans lui l'auth est desactivee
#   npx wrangler secret put GROQ_KEY        (au moins un fournisseur IA)
#   npx wrangler secret put OPENROUTER_KEY
#   npx wrangler secret put SEARCH_KEY      (optionnel : Tavily / Brave / Serper)
#   npx wrangler secret put INVITE_CODE     (optionnel : acces sur invitation)

# Quotas reels par utilisateur. Sans ce binding, les quotas ne sont
# qu'indicatifs et ne bloquent personne.
# Fork : cree ton propre namespace (npx wrangler kv namespace create ETHER_KV)
# et remplace l'id ci-dessous par celui qu'affiche la commande.
[[kv_namespaces]]
binding = "ETHER_KV"
id = "601d23be0b40404f8019f753ffad6210"

# Le site statique est servi par le meme worker que l'API :
# une seule origine, donc plus aucun probleme de CORS.
[assets]
directory = "./public"
not_found_handling = "single-page-application"
